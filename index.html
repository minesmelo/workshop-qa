<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop JS/TS</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0d1c33;
        --panel: rgba(11, 24, 44, 0.72);
        --panel-strong: rgba(14, 31, 57, 0.9);
        --line: rgba(255, 255, 255, 0.11);
        --text: #eef4ff;
        --muted: #9cb2d1;
        --accent: #66e3ff;
        --accent-2: #8b6cff;
        --accent-3: #31d39b;
        --warning: #ffcf5a;
        --danger: #ff7d9b;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
        --radius: 28px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(102, 227, 255, 0.17),
            transparent 28%
          ),
          radial-gradient(
            circle at 85% 10%,
            rgba(139, 108, 255, 0.22),
            transparent 26%
          ),
          radial-gradient(
            circle at 70% 82%,
            rgba(49, 211, 155, 0.18),
            transparent 24%
          ),
          linear-gradient(135deg, var(--bg), var(--bg-2));
        overflow: hidden;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: auto;
        border-radius: 999px;
        filter: blur(30px);
        opacity: 0.35;
        pointer-events: none;
      }

      body::before {
        width: 18rem;
        height: 18rem;
        background: rgba(102, 227, 255, 0.15);
        top: 8%;
        left: -5rem;
        animation: floaty 18s ease-in-out infinite;
      }

      body::after {
        width: 22rem;
        height: 22rem;
        background: rgba(139, 108, 255, 0.12);
        right: -7rem;
        bottom: -4rem;
        animation: floaty 22s ease-in-out infinite reverse;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(1);
        }
        50% {
          transform: translateY(-12px) translateX(10px) scale(1.04);
        }
      }

      .deck {
        height: 100vh;
        width: 100vw;
        position: relative;
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 30;
        padding: 18px 28px 0;
        pointer-events: none;
      }

      .progress-shell {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        backdrop-filter: blur(8px);
      }

      .progress-bar {
        height: 100%;
        width: 0;
        background: linear-gradient(
          90deg,
          var(--accent),
          var(--accent-2),
          var(--accent-3)
        );
        box-shadow: 0 0 24px rgba(102, 227, 255, 0.45);
        transition: width 0.35s ease;
      }

      .hud {
        position: fixed;
        bottom: 20px;
        left: 22px;
        right: 22px;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        pointer-events: none;
      }

      .brand {
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(6, 14, 26, 0.62);
        backdrop-filter: blur(18px);
        color: var(--muted);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.92rem;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow);
      }

      .brand strong {
        color: var(--text);
      }

      .slides {
        height: 100%;
        width: 100%;
        position: relative;
      }

      .slide {
        position: absolute;
        inset: 0;
        padding: 62px 64px 78px;
        display: grid;
        align-items: stretch;
        opacity: 0;
        transform: translateX(60px) scale(0.985);
        transition:
          opacity 0.45s ease,
          transform 0.55s ease;
        pointer-events: none;
      }

      .slide.active {
        opacity: 1;
        transform: translateX(0) scale(1);
        pointer-events: auto;
        z-index: 2;
      }

      .panel {
        height: 100%;
        border: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(13, 27, 49, 0.78),
          rgba(9, 20, 38, 0.76)
        );
        backdrop-filter: blur(20px);
        border-radius: calc(var(--radius) + 4px);
        box-shadow: var(--shadow);
        padding: 34px 36px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .panel > .eyebrow,
      .panel > .title,
      .panel > .lead {
        flex-shrink: 0;
      }

      .panel::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.08),
          transparent 25%,
          transparent 72%,
          rgba(255, 255, 255, 0.04)
        );
        pointer-events: none;
      }

      .slide-diagram {
        flex-shrink: 0;
        margin-bottom: 18px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.18);
        position: relative;
        z-index: 1;
      }

      .slide-diagram img {
        display: block;
        width: 100%;
        height: auto;
        max-height: min(38vh, 320px);
        object-fit: contain;
        object-position: center top;
      }

      .slide-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
        gap: 22px;
        height: 100%;
      }

      .slide-grid.single {
        grid-template-columns: 1fr;
      }
      .slide-grid.equal {
        grid-template-columns: 1fr 1fr;
      }
      .slide-grid.wide-right {
        grid-template-columns: 0.9fr 1.1fr;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: fit-content;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 14px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .cover h1 {
        font-size: clamp(2.8rem, 5vw, 4.7rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
        max-width: 12ch;
      }

      .cover .subtitle {
        font-size: clamp(1.1rem, 2vw, 1.55rem);
        color: var(--muted);
        margin-top: 18px;
        max-width: 40ch;
        line-height: 1.45;
      }

      .cover .footer {
        margin-top: auto;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 1rem;
      }

      .cover-art {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        height: 100%;
      }

      .orb,
      .mini-card,
      .stat-card,
      .badge,
      .code-block,
      .callout,
      .table-box {
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 24px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .orb {
        min-height: 190px;
        position: relative;
        overflow: hidden;
        padding: 20px;
        display: flex;
        align-items: end;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .orb::before {
        content: "";
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        top: 18px;
        right: 18px;
        filter: blur(2px);
        opacity: 0.85;
      }

      .orb.a::before {
        background: radial-gradient(
          circle,
          rgba(102, 227, 255, 0.9),
          rgba(102, 227, 255, 0.08) 72%
        );
      }
      .orb.b::before {
        background: radial-gradient(
          circle,
          rgba(139, 108, 255, 0.9),
          rgba(139, 108, 255, 0.08) 72%
        );
      }
      .orb.c::before {
        background: radial-gradient(
          circle,
          rgba(49, 211, 155, 0.9),
          rgba(49, 211, 155, 0.08) 72%
        );
      }
      .orb.d::before {
        background: radial-gradient(
          circle,
          rgba(255, 207, 90, 0.9),
          rgba(255, 207, 90, 0.08) 72%
        );
      }

      .title {
        font-size: clamp(1.95rem, 3vw, 2.7rem);
        line-height: 1.04;
        letter-spacing: -0.035em;
        margin-bottom: 10px;
        max-width: 16ch;
      }

      .lead {
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.55;
        margin-bottom: 20px;
        max-width: 64ch;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 16px;
      }

      .chip {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-size: 0.92rem;
      }

      .section-title {
        font-size: 0.88rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 10px;
      }

      .section-title.section-title--reference {
        padding-top: 1.25rem;
      }

      .section-button {
        font-size: 0.88rem;
        letter-spacing: 0.12em;
        font-weight: 700;
        color: white;
        background-color: transparent;
        margin-top: 10px;
        border-radius: 4px;
        border: 2px solid var(--accent);
        padding: 5px;
      }

      .section-button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .section-button:disabled,
      .section-button[aria-busy="true"] {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .code-example {
        margin-bottom: 20px;
      }

      .code-example:last-child {
        margin-bottom: 0;
      }

      .code-example-hint {
        margin: 10px 0 0;
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .bullet-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .bullet-list li {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 12px;
        align-items: start;
        color: var(--text);
        font-size: 1.02rem;
        line-height: 1.48;
      }

      .bullet-list li::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-top: 0.42rem;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 16px rgba(102, 227, 255, 0.4);
      }

      .bullet-list a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .bullet-list a:hover {
        color: #9aefff;
      }

      .bullet-list--compact {
        gap: 10px;
      }
      .bullet-list--compact li {
        font-size: 0.88rem;
        line-height: 1.38;
      }
      .bullet-list--compact li::before {
        margin-top: 0.32rem;
        width: 8px;
        height: 8px;
      }

      .mini-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mini-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .mini-card {
        padding: 18px;
        min-height: 92px;
      }

      .mini-card h3 {
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .mini-card p {
        color: var(--muted);
        line-height: 1.45;
        font-size: 0.94rem;
      }

      .closing-grid {
        margin-top: 4px;
      }
      .closing-block__link {
        display: inline-flex;
        align-items: center;
        margin-top: 12px;
        font-size: 0.88rem;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        background: transparent;
        border-radius: 4px;
        border: 2px solid var(--accent);
        padding: 8px 12px;
      }
      .closing-block__link:hover {
        background: rgba(102, 227, 255, 0.12);
      }

      .slide--thank-you .panel.thank-you-panel {
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 100%;
      }
      .thank-you-inner {
        position: relative;
        z-index: 2;
        max-width: 32ch;
      }
      .thank-you-title {
        font-size: clamp(2.4rem, 6.5vw, 3.9rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
        margin: 0 0 0.4em;
        background: linear-gradient(125deg, #66e3ff, #8b6cff, #31d39b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .thank-you-subtitle {
        font-size: 1.15rem;
        color: var(--muted);
        line-height: 1.5;
        margin: 0;
      }

      .closing-block__qr-wrap {
        margin: 12px auto 0;
        display: block;
        width: fit-content;
        max-width: 100%;
        border-radius: 8px;
        background: #fff;
        padding: 8px;
        line-height: 0;
      }
      .closing-block__qr {
        display: block;
        width: 100%;
        max-width: 200px;
        height: auto;
        image-rendering: auto;
      }

      .callout {
        padding: 18px 20px;
        margin-top: 16px;
        color: var(--text);
        line-height: 1.5;
        font-size: 0.98rem;
      }

      .callout strong {
        color: var(--warning);
      }

      .callout.callout-warn {
        border-color: rgba(255, 207, 90, 0.45);
        background: linear-gradient(
          135deg,
          rgba(255, 207, 90, 0.12),
          rgba(255, 207, 90, 0.04)
        );
      }

      .callout.callout-warn strong:first-child {
        color: var(--warning);
        letter-spacing: 0.04em;
      }

      /* All slides: slightly tighter code so more lines fit (same for ES6 and everywhere) */
      .code-block {
        padding: 10px 14px 12px;
        font-family:
          "SFMono-Regular", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        font-size: 0.8rem;
        line-height: 1.4;
        overflow: auto;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .code-source {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        tab-size: 2;
      }

      .code-source code {
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        color: #b8d9f5;
      }

      .code-source .code-hl-keyword {
        color: #c9b5ff;
      }

      .code-source .code-hl-string {
        color: #ffc98a;
      }

      .code-source .code-hl-comment {
        color: #6b8fb0;
        font-style: italic;
      }

      .code-source .code-hl-number {
        color: #5fd4b8;
      }

      .code-source .code-hl-type {
        color: #7ec8ff;
      }

      .code-output {
        margin-top: 10px;
        padding: 10px 12px 12px;
        border-radius: 16px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(49, 211, 155, 0.2);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        font-size: 0.8rem;
        line-height: 1.4;
      }

      .code-output-label {
        margin: 0 0 6px;
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .code-output-body {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        tab-size: 2;
      }

      .code-output-body code {
        font-family: inherit;
        font-size: inherit;
        line-height: inherit;
        color: #7ee8c5;
      }

      .code-output.is-error .code-output-body code {
        color: #ffb8c8;
      }

      .code-output-empty {
        color: var(--muted);
        font-style: italic;
        font-size: 0.95em;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--muted);
        margin-top: auto;
        font-size: 0.92rem;
      }

      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .legend b {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .stats-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 16px;
      }

      .stat-card {
        padding: 18px;
      }

      .stat-card .big {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
      }

      .stat-card p {
        color: var(--muted);
        line-height: 1.4;
        font-size: 0.93rem;
      }

      .table-box {
        overflow: hidden;
        margin-top: 14px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        vertical-align: top;
      }

      th {
        color: var(--accent);
        font-size: 0.82rem;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.03);
      }

      td {
        color: var(--text);
      }
      tr:last-child td {
        border-bottom: none;
      }

      .agenda-list {
        display: grid;
        gap: 14px;
        margin-top: 12px;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding-right: 6px;
        -webkit-overflow-scrolling: touch;
      }

      .agenda-list::-webkit-scrollbar {
        width: 8px;
      }

      .agenda-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 999px;
      }

      .agenda-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
      }

      .agenda-list::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      .agenda-group {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .agenda-group + .agenda-group {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .agenda-group-title {
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 2px 2px;
      }

      .agenda-item {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 16px;
        align-items: center;
        padding: 16px 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .agenda-number {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(
          135deg,
          rgba(102, 227, 255, 0.18),
          rgba(139, 108, 255, 0.18)
        );
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .agenda-item h3 {
        font-size: 1.05rem;
        margin-bottom: 4px;
      }
      .agenda-item p {
        color: var(--muted);
        font-size: 0.94rem;
      }

      /* Slide 2 — tighter agenda: less padding, smaller type, denser items */
      .panel--agenda-compact {
        padding: 22px 24px;
      }
      .panel--agenda-compact > .eyebrow {
        margin-bottom: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
      }
      .panel--agenda-compact > .title {
        font-size: clamp(1.45rem, 2.1vw, 1.95rem);
        margin-bottom: 4px;
        max-width: none;
      }
      .panel--agenda-compact > .lead {
        font-size: 0.95rem;
        line-height: 1.4;
        margin-bottom: 10px;
        max-width: 70ch;
      }
      .panel--agenda-compact .agenda-list {
        gap: 8px;
        margin-top: 2px;
      }
      .panel--agenda-compact .agenda-group {
        gap: 8px;
      }
      .panel--agenda-compact .agenda-group + .agenda-group {
        margin-top: 10px;
        padding-top: 10px;
      }
      .panel--agenda-compact .agenda-group-title {
        font-size: 0.8rem;
        margin: 0 0 0 1px;
      }
      .panel--agenda-compact .agenda-item {
        grid-template-columns: 40px 1fr;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 16px;
        align-items: start;
      }
      .panel--agenda-compact .agenda-number {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        font-size: 1.02rem;
      }
      .panel--agenda-compact .agenda-item h3 {
        font-size: 0.95rem;
        margin-bottom: 2px;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

      }

      const JS_TS_KEYWORDS = new Set(
        `abstract any as asserts async await break case catch class const continue debugger declare default delete do else enum export extends false finally for from function get if implements import in infer instanceof interface is keyof let module namespace never new null of override package private protected public readonly return satisfies static super switch this throw true try type typeof undefined unknown using var void while with yield`
          .trim()
          .split(/\s+/),
      );

      const TS_PRIMITIVE_TYPES = new Set([
        "string",
        "number",
        "boolean",
        "bigint",
        "symbol",
      ]);

      function hlSpan(cls, text) {
        return `<span class="code-hl-${cls}">${escapeHtml(text)}</span>`;
      }

      function isDigit(c) {
        return c >= "0" && c <= "9";
      }

      function isIdStart(c) {
        return /[a-zA-Z_$]/.test(c);
      }

      function isIdPart(c) {
        return /[a-zA-Z0-9_$]/.test(c);
      }

      function scanStringEnd(src, start, quote) {
        const n = src.length;
        let i = start + 1;
        if (quote === "`") {
          while (i < n) {
            const ch = src[i];
            if (ch === "\\") {
              i += 2;
              continue;
            }
            if (ch === "`") return i + 1;
            if (ch === "$" && src[i + 1] === "{") {
              i += 2;
              let depth = 1;
              while (i < n && depth > 0) {
                if (src[i] === "{") depth++;
                else if (src[i] === "}") depth--;
                i++;
              }
              continue;
            }
            i++;
          }
          return n;
        }
        while (i < n) {
          if (src[i] === "\\") {
            i += 2;
            continue;
          }
          if (src[i] === quote) return i + 1;
          i++;
        }
        return n;
      }

      function scanNumberEnd(src, start) {
        const n = src.length;
        let i = start;
        if (src[i] === "0" && i + 1 < n) {
          const nx = src[i + 1];
          if (nx === "x" || nx === "X") {
            i += 2;
            while (i < n && /[0-9a-fA-F]/.test(src[i])) i++;
            return i;
          }
          if (nx === "b" || nx === "B") {
            i += 2;
            while (i < n && /[01]/.test(src[i])) i++;
            return i;
          }
          if (nx === "o" || nx === "O") {
            i += 2;
            while (i < n && /[0-7]/.test(src[i])) i++;
            return i;
          }
        }
        while (i < n && isDigit(src[i])) i++;
        if (i < n && src[i] === ".") {
          i++;
          while (i < n && isDigit(src[i])) i++;
        }
        if (i < n && (src[i] === "e" || src[i] === "E")) {
          i++;
          if (i < n && (src[i] === "+" || src[i] === "-")) i++;
          while (i < n && isDigit(src[i])) i++;
        }
        if (i < n && src[i] === "n") i++;
        return i;
      }

      function highlightJavaScript(src) {
        const n = src.length;
        let out = "";
        let i = 0;
        while (i < n) {
          const c = src[i];
          const rest = src.slice(i);

          if (/\s/.test(c)) {
            out += escapeHtml(c);
            i++;
            continue;
          }

          if (rest.startsWith("//")) {
            const endLine = src.indexOf("\n", i);
            const chunk = endLine === -1 ? src.slice(i) : src.slice(i, endLine);
            out += hlSpan("comment", chunk);
            i += chunk.length;
            continue;
          }

          if (rest.startsWith("/*")) {
            const end = src.indexOf("*/", i + 2);
            const chunk = end === -1 ? src.slice(i) : src.slice(i, end + 2);
            out += hlSpan("comment", chunk);
            i += chunk.length;
            continue;
          }

          if (c === '"' || c === "'" || c === "`") {
            const end = scanStringEnd(src, i, c);
            out += hlSpan("string", src.slice(i, end));
            i = end;
            continue;
          }

          if (isDigit(c) || (c === "." && i + 1 < n && isDigit(src[i + 1]))) {
            const end = scanNumberEnd(src, i);
            if (end > i) {
              out += hlSpan("number", src.slice(i, end));
              i = end;
              continue;
            }
          }

          if (isIdStart(c)) {
            let j = i + 1;
            while (j < n && isIdPart(src[j])) j++;
            const word = src.slice(i, j);
            if (JS_TS_KEYWORDS.has(word)) {
              out += hlSpan("keyword", word);
            } else if (TS_PRIMITIVE_TYPES.has(word)) {
              out += hlSpan("type", word);
            } else {
              out += escapeHtml(word);
            }
            i = j;
            continue;
          }

          out += escapeHtml(c);
          i++;
        }
        return out;
      }

        } else {
          if (!slide.codeFile || slide.executedCode) return;
          file = slide.codeFile;
          useESModule = Boolean(slide.runAsESModule);
          codeBlockId = "code-" + slideIndex;
          markExecuted = () => {
            slide.executedCode = true;
          };
        }

        if (runCodeInFlight.has(codeBlockId)) return;
        runCodeInFlight.add(codeBlockId);

        const runBtnId =
          exampleIndex !== undefined && exampleIndex !== null
            ? "runCodeBtn-" + slideIndex + "-" + exampleIndex
            : "runCodeBtn-" + slideIndex;
        const runBtn = document.getElementById(runBtnId);
        const runLabelDefault = runBtn ? runBtn.textContent : "Run Code";
        if (runBtn) {
          runBtn.disabled = true;

          runBtn.textContent = "Running…";
        }

        let runSucceeded = false;
        try {
          const response = await fetch(file);
          let code = await response.text();
          code = code
            .replace(
              /\/\/# sourceMappingURL=data:application\/json;base64,[A-Za-z0-9+/=]+\s*/g,
              "",
            )
            .trimEnd();

          if (file.endsWith(".ts") && !useESModule) {
            const ts = await import("typescript");
            const { outputText } = ts.transpileModule(code, {
              compilerOptions: {
                module: ts.ModuleKind.ESNext,
                target: ts.ScriptTarget.ES2020,
              },
            });
            code = outputText;
          }

          const logs = [];
          const origLog = console.log;
          console.log = (...args) => {
            logs.push(
              args
                .map((a) =>
                  typeof a === "object"
                    ? JSON.stringify(a, null, 2)
                    : String(a),
                )
                .join(" "),
            );
            origLog.apply(console, args);
          };

          try {
            if (useESModule) {
              const moduleUrl = new URL(file, window.location.href).href;
              await import(/* @vite-ignore */ moduleUrl);
            } else {
              const run = new Function(
                "return (async () => {\n" + code + "\n})();",
              );
              const result = run();
              if (result != null && typeof result.then === "function") {
                await result;
              }
            }
            // Microtasks (e.g. Promise.then) run before await result settles; macrotasks
            // (setTimeout) run after. Yield one turn so timer callbacks still hit our logger.
            await new Promise((resolve) => setTimeout(resolve, 0));
          } catch (e) {
            logs.push("Error: " + e.message);
          }

          console.log = origLog;

          const codeBlock = document.getElementById(codeBlockId);
          if (codeBlock) {
            const outText = logs.join("\n");
            const hasErr = /^Error:/m.test(outText);
            const outHtml = outText
              ? escapeHtml(outText)
              : '<span class="code-output-empty">(no console output)</span>';
            codeBlock.insertAdjacentHTML(
              "beforeend",
              `<aside class="code-output${hasErr ? " is-error" : ""}" aria-label="Program output">
                <div class="code-output-label">Output</div>
                <pre class="code-output-body"><code>${outHtml}</code></pre>
              </aside>`,
            );
            markExecuted();
            runSucceeded = true;
          }
        } catch (error) {
          console.error("Failed to load code file:", error);
        } finally {
          runCodeInFlight.delete(codeBlockId);
          if (runBtn) {
            runBtn.removeAttribute("aria-busy");
            if (runSucceeded) {
              runBtn.disabled = true;
              runBtn.textContent = "Done";
            } else {

                  <div>
                    <h3>${item[0]}</h3>
                    <p>${item[1]}</p>
                  </div>
                </div>`;
              })
              .join("");
            return `
            <div class="agenda-group">
              <div class="agenda-group-title">${group.title}</div>
              ${items}
            </div>
          `;
          })
          .join("");
      }

      function renderBullets(items, compact) {
        if (!items || !items.length) return "";
        const listClass = compact
          ? "bullet-list bullet-list--compact"
          : "bullet-list";
        return `<ul class="${listClass}">${items
          .map((item) => `<li><span>${item}</span></li>`)
          .join("")}</ul>`;
      }

      function renderCards(cards, three = false) {
        if (!cards || !cards.length) return "";
        return `<div class="mini-grid ${
          cards.length === 3 || three ? "three" : ""
        }">${cards
          .map(
            ([title, body]) => `
        <div class="mini-card">
          <h3>${title}</h3>
          <p>${body}</p>
        </div>`,
          )
          .join("")}</div>`;
      }

      function renderTable(table) {
        if (!table || !table.length) return "";
        const [head, ...rows] = table;
        return `<div class="table-box"><table>
        <thead><tr>${head
          .map((cell) => `<th>${cell}</th>`)
          .join("")}</tr></thead>
        <tbody>${rows
          .map(
            (row) =>
              `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`,
          )
          .join("")}</tbody>
      </table></div>`;
      }

      async function renderCode(code, file, slideIndex, subId) {
        const blockId =
          subId !== undefined && subId !== null
            ? `code-${slideIndex}-${subId}`
            : `code-${slideIndex}`;
        const wrapInCodeBlock = (raw) =>
          `<div class="code-block" id="${blockId}"><pre class="code-source"><code>${highlightJavaScript(
            raw,
          )}</code></pre></div>`;

        let content = "";
        if (code) {
          content = wrapInCodeBlock(code);
        }

        if (file) {
          try {
            const response = await fetch(file);
            const text = await response.text();
            const cleaned = text
              .replace(
                /\/\/# sourceMappingURL=data:application\/json;base64,[A-Za-z0-9+/=]+\s*/g,
                "",
              )
              .trimEnd();
            content = wrapInCodeBlock(cleaned);
          } catch (error) {
            console.error("Failed to load code file:", error);
            content = wrapInCodeBlock("// Error loading code file");
          }
        }

        return content;
      }

      (async () => {
        for (const [index, slide] of slides.entries()) {
          const section = document.createElement("section");
          section.className = [
            "slide",
            index === 0 ? "active" : "",
            index > 19 ? "dense" : "",
            slide.kind === "thankYou" ? "slide--thank-you" : "",
          ]
            .filter(Boolean)
            .join(" ");

          if (slide.kind === "cover") {
            section.innerHTML = `
          <div class="panel cover">
            <div class="slide-grid equal">
              <div class="split-stack">
                <div>
                  <div class="eyebrow">${slide.eyebrow}</div>
                  <h1>${slide.title}</h1>
                  <p class="subtitle">${slide.subtitle}</p>
                </div>
                <div class="footer">${slide.footer
                  .map((item) => `<span class="chip">${item}</span>`)
                  .join("")}</div>
              </div>
              <div class="cover-art">
                <div class="orb a">Runtime thinking</div>
                <div class="orb b">Safer contracts</div>
                <div class="orb c">Clear structure</div>
                <div class="orb d">Better debugging</div>
              </div>
            </div>
          </div>`;
          } else if (slide.kind === "thankYou") {
            section.innerHTML = `
          <div class="panel thank-you-panel">
            <div class="thank-you-inner">
              <h1 class="thank-you-title">${slide.title}</h1>
              ${
                slide.subtitle
                  ? `<p class="thank-you-subtitle">${slide.subtitle}</p>`
                  : ""
              }
            </div>
          </div>`;
          } else if (slide.kind === "closing" && slide.closingBlocks?.length) {
            const blocksHtml = slide.closingBlocks
              .map(
                (b) => `
            <div class="mini-card closing-block">
              <h3>${b.title}</h3>
              <p>${b.text}</p>
              ${renderClosingBlockQr(b)}
              ${
                b.link
                  ? `<a class="closing-block__link" href="${b.link}" target="_blank" rel="noopener noreferrer">${b.linkLabel || "Open link"}</a>`
                  : ""
              }
            </div>`,
              )
              .join("");
            section.innerHTML = `
          <div class="panel">
            <div class="eyebrow">${slide.eyebrow}</div>
            <h2 class="title">${slide.title}</h2>
            ${slide.lead ? `<p class="lead">${slide.lead}</p>` : ""}
            <div class="mini-grid three closing-grid">${blocksHtml}</div>
          </div>`;
          } else if (slide.agendaGroups || slide.agenda) {
            const agendaHtml = slide.agendaGroups
              ? renderAgendaGroups(slide.agendaGroups)
              : slide.agenda
                .map(
                  (item, idx) => `
                <div class="agenda-item">
                  <div class="agenda-number">${idx + 1}</div>
                  <div>
                    <h3>${item[0]}</h3>
                    <p>${item[1]}</p>
                  </div>
                </div>
              `,
                )
                .join("");
            const agendaPanelClass = slide.agendaCompact
              ? "panel panel--agenda-compact"
              : "panel";
            section.innerHTML = `
          <div class="${agendaPanelClass}">
            <div class="eyebrow">${slide.eyebrow}</div>
            <h2 class="title">${slide.title}</h2>
            <p class="lead">${slide.lead || ""}</p>
            <div class="agenda-list">
              ${agendaHtml}
            </div>
          </div>`;
          } else {
            const layoutClass = slide.layout ? slide.layout : "equal";
            const narrativeCore = slide.leftSection
              ? `
            <div class="eyebrow">${slide.eyebrow || ""}</div>
            <h2 class="title">${slide.title}</h2>
            ${slide.lead ? `<p class="lead">${slide.lead}</p>` : ""}
            ${
              slide.chips
                ? `<div class="chips">${slide.chips
                    .map((ch) => `<span class="chip">${ch}</span>`)
                    .join("")}</div>`
                : ""
            }
            ${
              slide.leftSection.title
                ? `<div class="section-title">${slide.leftSection.title}</div>`
                : ""
            }
            ${renderBullets(
              slide.leftSection.bullets,
              slide.leftSection.bulletListCompact,
            )}
            ${
              slide.callout
                ? `<div class="callout${slide.calloutClass ? " " + slide.calloutClass : ""}">${slide.callout}</div>`
                : ""
            }
            ${
              slide.referenceInLeft && slide.table
                ? `<div class="section-title section-title--reference">Reference</div>${renderTable(
                    slide.table,
                  )}`
                : ""
            }`
              : "";

            const footerNoteHtml = slide.footerNote
              ? `<div class="footer-note">${slide.footerNote}</div>`
              : "";

            const narrativeInner = slide.leftSection
              ? `${narrativeCore}${footerNoteHtml}`
              : "";

            let code = "";
            if (slide.codeExamples && slide.codeExamples.length) {
              for (let i = 0; i < slide.codeExamples.length; i++) {
                const ex = slide.codeExamples[i];
                code += `<div class="code-example">`;
                if (ex.title) {
                  code += `<div class="section-title">${ex.title}</div>`;
                }
                code += await renderCode(null, ex.file, index, i);
                if (!ex.readOnly) {
                  code += `<button type="button" id="runCodeBtn-${index}-${i}" class="section-button" onclick="execute(${index}, ${i})">Run Code</button>`;
                } else {
                  code += `<p class="code-example-hint">Read-only — E2E runs in Detox, not in this browser runner.</p>`;
                }
                code += `</div>`;
              }
            } else {
              code = await renderCode(slide.code, slide.codeFile, index);
            }

            const quickViewBlock =
              slide.rightCards && slide.rightCards.length
                ? `<div class="section-title">Quick view</div>${renderCards(
                    slide.rightCards,
                    slide.rightCards.length === 3,
                  )}`
                : "";

            const diagramHtml = slide.diagram
              ? `<div class="slide-diagram"><img src="${escapeHtml(
                  slide.diagram.src,
                )}" alt="${escapeHtml(
                  slide.diagram.alt || "",
                )}" loading="lazy" /></div>`
              : "";

            const leftSection = slide.leftSection
              ? `<div class="panel">${
                  slide.quickViewInLeftPanel && quickViewBlock
                    ? `${narrativeCore}${quickViewBlock}${footerNoteHtml}`
                    : narrativeInner
                }</div>`
              : "";

            const exampleRunTable = `
            ${
              code && !slide.codeExamples?.length
                ? `<div class="section-title">Example</div>${code}`
                : code || ""
            }
            ${
              slide.codeFile && !slide.codeExamples?.length
                ? `<button type="button" id="runCodeBtn-${index}" class="section-button" onclick="execute(${index})">Run Code</button>`
                : ""
            }
            ${
              slide.table && !slide.referenceInLeft
                ? `<div class="section-title${
                    slide.referenceTopPadding
                      ? " section-title--reference"
                      : ""
                  }">Reference</div>${renderTable(slide.table)}`
                : ""
            }`;

            const rightSection = `
          <div class="panel">
            ${diagramHtml}
            ${exampleRunTable}
            ${
              quickViewBlock && !slide.quickViewInLeftPanel
                ? quickViewBlock
                : ""
            }
          </div>`;

            section.innerHTML = `<div class="slide-grid ${layoutClass}">${
              layoutClass === "single"
                ? leftSection
                : leftSection + rightSection
            }</div>`;
          }

          slidesEl.appendChild(section);
        }

        let current = 0;
        const slideEls = Array.from(document.querySelectorAll(".slide"));
        const progressBar = document.getElementById("progressBar");
        const thankYouSlideIndex = slides.findIndex((s) => s.kind === "thankYou");
        let thankYouConfettiId = null;
        const confettiLib =
          typeof globalThis !== "undefined" && typeof globalThis.confetti === "function"
            ? globalThis.confetti
            : null;

        function goToSlide(nextIndex) {
          if (thankYouConfettiId !== null) {
            clearInterval(thankYouConfettiId);
            thankYouConfettiId = null;
          }
          current = Math.max(0, Math.min(slideEls.length - 1, nextIndex));
          slideEls.forEach((slide, idx) => {
            slide.classList.toggle("active", idx === current);
          });
          progressBar.style.width = `${
            ((current + 1) / slideEls.length) * 100
          }%`;
          location.hash = `slide-${current + 1}`;

          if (
            thankYouSlideIndex >= 0 &&
            current === thankYouSlideIndex &&
            confettiLib
          ) {
            const confettiColors = [
              "#66e3ff",
              "#8b6cff",
              "#31d39b",
              "#ffcf5a",
              "#ff7d9b",
              "#eef4ff",
            ];
            void confettiLib({
              particleCount: 140,
              spread: 100,
              origin: { y: 0.28, x: 0.5 },
              colors: confettiColors,
              zIndex: 35,
            });
            setTimeout(() => {
              if (current !== thankYouSlideIndex) return;
              void confettiLib({
                particleCount: 90,
                spread: 120,
                startVelocity: 50,
                origin: { y: 0.55, x: 0.2 },
                colors: confettiColors,
                zIndex: 35,
              });
            }, 220);
            setTimeout(() => {
              if (current !== thankYouSlideIndex) return;
              void confettiLib({
                particleCount: 90,
                spread: 120,
                startVelocity: 50,
                origin: { y: 0.55, x: 0.8 },
                colors: confettiColors,
                zIndex: 35,
              });
            }, 420);
            thankYouConfettiId = setInterval(() => {
              if (current !== thankYouSlideIndex) {
                if (thankYouConfettiId !== null) {
                  clearInterval(thankYouConfettiId);
                  thankYouConfettiId = null;
                }
                return;
              }
              void confettiLib({
                particleCount: 4,
                spread: 55,
                startVelocity: 32,
                angle: 90,
                origin: {
                  x: 0.08 + Math.random() * 0.84,
                  y: -0.04,
                },
                gravity: 0.9,
                ticks: 200,
                colors: confettiColors,
                zIndex: 35,
                scalar: 0.9,
              });
            }, 320);
          }
        }

        document
          .getElementById("prevBtn")
          .addEventListener("click", () => goToSlide(current - 1));
        document
          .getElementById("nextBtn")
          .addEventListener("click", () => goToSlide(current + 1));

        window.addEventListener("keydown", (event) => {
          if (["ArrowRight", "PageDown", " "].includes(event.key)) {
            event.preventDefault();
            goToSlide(current + 1);
          }
          if (["ArrowLeft", "PageUp"].includes(event.key)) {
            event.preventDefault();
            goToSlide(current - 1);
          }
          if (event.key === "Home") goToSlide(0);
          if (event.key === "End") goToSlide(slideEls.length - 1);
        });

        const hashMatch = location.hash.match(/slide-(\d+)/);
        if (hashMatch) {
          goToSlide(Number(hashMatch[1]) - 1);
        } else {
          goToSlide(0);
        }
      })();
    </script>
  </body>
</html>
